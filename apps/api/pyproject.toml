[project]
name = "stellar-lense-api"
version = "0.2.0"
description = "Stellar Lense public REST API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.4",
    # Detection engine (Benford + heuristics, Horizon loader). Workspace member.
    "stellar-lense-core",
]

[project.optional-dependencies]
# Enables the optional ML scoring path when a model bundle is present.
ml = ["stellar-lense-core[ml]"]
test = [
    "stellar-lense-core[ml]",
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "httpx>=0.27.0,<1.0",
]

[tool.uv.sources]
stellar-lense-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]
