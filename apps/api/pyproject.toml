[project]
name = "stellar-lense-api"
version = "0.0.0"
description = "Stellar Lense public REST API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.4",
    "httpx==0.27.0",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scikit-learn==1.5.0",
    "xgboost==2.0.3",
    "lightgbm==4.3.0",
    "shap==0.45.1",
    "imbalanced-learn==0.12.3",
]

[project.optional-dependencies]
test = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "detection", "ingestion"]
