[package]
name = "schema-gen"
version = "0.1.0"
edition = "2021"
description = "Spike PoC: generate JSON Schema / TypeScript / Python bindings for the canonical RiskScore contracttype directly from its Soroban contract-spec metadata"

[dependencies]
anyhow = "1.0"
stellar-lense-score = { path = "../../contracts/stellar-lense-score" }
serde_json = { version = "1.0", features = ["preserve_order"] }
soroban-sdk = "21.0.0"
soroban-spec = "21.7.7"

[[bin]]
name = "schema-gen"
path = "src/main.rs"