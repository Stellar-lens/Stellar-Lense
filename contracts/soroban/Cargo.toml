[workspace]
resolver = "2"
members = [
    "contracts/stellar-lense-registry",
]
# The original stellar-lense-score contract and its tooling: a separate
# workspace, not built, tested or deployed by default. See experimental/README.md.
exclude = ["experimental"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
strip = "symbols"

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
