[package]
name = "stellar-lense-registry"
version = "2.0.0"
edition = "2021"
publish = false
description = "Stellar Lense risk-score registry: signer-published wash-trading scores and a risk gate for other contracts"
repository = "https://github.com/Stellar-lens/Stellar-Lense"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "21.0.0"

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
