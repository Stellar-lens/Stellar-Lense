[package]
name = "mock-amm"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT"
description = "Example: an AMM-shaped contract that refuses swaps from wallets the Stellar Lense registry rates high-risk"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "21.0.0"

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
# Only tests link the registry itself; the contract talks to it through the
# one-function client declared in src/lib.rs.
stellar-lense-registry = { path = "../stellar-lense-registry" }

[features]
testutils = ["soroban-sdk/testutils"]
