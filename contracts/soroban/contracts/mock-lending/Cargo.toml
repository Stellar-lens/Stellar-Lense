[package]
name = "mock-lending"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Minimal mock lending protocol that gates borrows on Stellar Lense's query_risk_gate_with_confidence, used by the cross-contract composability integration suite"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "21.0.0"
stellar-lense-score = { version = "0.1.0", path = "../stellar-lense-score" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
