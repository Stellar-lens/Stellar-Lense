[package]
name = "invocation-fuzzer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Deterministic corpus-guided fuzzer for Stellar Lense cross-contract invocation payloads"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
stellar-lense-score = { path = "../../contracts/stellar-lense-score" }
stellar-lense-aggregator = { path = "../../contracts/stellar-lense-aggregator" }
mock-amm = { path = "../../contracts/mock-amm" }
mock-lending = { path = "../../contracts/mock-lending" }
