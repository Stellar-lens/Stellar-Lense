<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LedgerLens — Stellar DEX Fraud Detection</title>
    <meta
      name="description"
      content="Live wash-trade risk scores, alerts, and asset rankings for the Stellar DEX, powered by LedgerLens' Benford's Law + ensemble ML detection engine."
    />
    <meta property="og:title" content="LedgerLens — Stellar DEX Fraud Detection" />
    <meta
      property="og:description"
      content="Live wash-trade risk scores, alerts, and asset rankings for the Stellar DEX."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <span class="logo">LedgerLens</span>
      <span class="tagline">Stellar DEX Wash Trade Detection</span>
      <div class="header-right">
        <span class="last-updated" id="last-updated"></span>
        <button class="refresh-btn" id="refresh-btn" title="Refresh now">⟳ Refresh</button>
        <button class="theme-toggle" id="theme-toggle" title="Toggle light/dark theme">🌙</button>
        <span class="status-dot" id="status-dot" title="API status"></span>
      </div>
    </header>

    <main>
      <!-- Stats row -->
      <div class="stats" id="stats-row">
        <div class="stat">
          <div class="value skeleton" id="stat-flagged">—</div>
          <div class="label">Flagged Wallets</div>
        </div>
        <div class="stat">
          <div class="value skeleton" id="stat-assets">—</div>
          <div class="label">Asset Pairs Monitored</div>
        </div>
        <div class="stat">
          <div class="value skeleton" id="stat-avg">—</div>
          <div class="label">Avg Risk Score</div>
        </div>
      </div>

      <!-- Score lookup -->
      <div class="card">
        <h2>Score Lookup</h2>
        <div class="search-row">
          <input id="wallet-input" type="text" placeholder="Wallet address (G…)" />
          <input id="pair-input" type="text" placeholder="Asset pair (e.g. XLM/USDC:GA5Z…)" />
          <button id="lookup-btn">Score</button>
        </div>

        <div class="score-result" id="score-result">
          <div class="gauge-wrap">
            <div class="gauge" id="score-gauge">
              <span class="score-num" id="score-num">—</span>
              <span class="score-label">/ 100</span>
            </div>
            <div id="score-risk-label" style="font-size: 12px; color: var(--text-muted)"></div>
          </div>

          <div class="score-detail">
            <div class="flag-row" id="flag-row"></div>
            <div id="score-meta" style="font-size: 12px; color: var(--text-muted)"></div>
          </div>
        </div>

        <div
          id="lookup-error"
          style="color: var(--red); font-size: 13px; margin-top: 8px; display: none"
        ></div>
      </div>

      <!-- Recent alerts -->
      <div class="card">
        <h2>
          Recent Alerts
          <span style="font-weight: 400; color: var(--text-muted); font-size: 12px"
            >(score ≥ 75)</span
          >
        </h2>
        <input
          class="filter-input"
          id="alerts-filter"
          type="text"
          placeholder="Filter by wallet or asset pair…"
        />
        <table class="alerts-table">
          <thead>
            <tr>
              <th>Wallet</th>
              <th>Asset Pair</th>
              <th class="sortable" data-sort-key="score">Score</th>
              <th>Reason</th>
              <th class="sortable" data-sort-key="timestamp">Flagged At</th>
            </tr>
          </thead>
          <tbody id="alerts-body">
            <tr>
              <td colspan="5"><div class="empty-state">Loading…</div></td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Asset risk ranking -->
      <div class="card">
        <h2>Asset Risk Ranking</h2>
        <input
          class="filter-input"
          id="assets-filter"
          type="text"
          placeholder="Filter by asset pair…"
        />
        <div class="asset-grid" id="asset-grid">
          <div class="empty-state">Loading…</div>
        </div>
      </div>
    </main>

    <script src="config.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
