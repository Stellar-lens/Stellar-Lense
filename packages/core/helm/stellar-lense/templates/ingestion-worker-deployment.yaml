{{- if .Values.ingestionWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stellar-lense.fullname" . }}-ingestion-worker
  labels:
    {{- include "stellar-lense.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion-worker
spec:
  replicas: {{ .Values.ingestionWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "stellar-lense.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ingestion-worker
  template:
    metadata:
      labels:
        {{- include "stellar-lense.labels" . | nindent 8 }}
        app.kubernetes.io/component: ingestion-worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "stellar-lense.serviceAccountName" . }}
      containers:
        - name: ingestion-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "cli", "stream"]
          livenessProbe:
            {{- toYaml .Values.ingestionWorker.livenessProbe | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "stellar-lense.fullname" . }}
            - secretRef:
                name: {{ include "stellar-lense.fullname" . }}
          env:
            {{- if .Values.postgresql.enabled }}
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "stellar-lense.fullname" . }}-postgresql
                  key: postgres-password
            - name: STELLARLENSE_DB_URL
              value: "postgresql://{{ .Values.postgresql.auth.username }}:$(PG_PASSWORD)@{{ include "stellar-lense.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
            {{- end }}
          resources:
            {{- toYaml .Values.ingestionWorker.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /data
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "stellar-lense.fullname" . }}
        {{- end }}
      {{- with .Values.ingestionWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingestionWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingestionWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
