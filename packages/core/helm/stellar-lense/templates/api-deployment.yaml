{{- if not .Values.canary.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stellar-lense.fullname" . }}-api
  labels:
    {{- include "stellar-lense.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    {{- include "stellar-lense.deploymentMetaAnnotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "stellar-lense.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        {{- include "stellar-lense.deploymentMetaAnnotations" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "stellar-lense.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "stellar-lense.serviceAccountName" . }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "stellar-lense.fullname" . }}
            - secretRef:
                name: {{ include "stellar-lense.fullname" . }}
            {{- if .Values.costConfig.enabled }}
            - configMapRef:
                name: {{ include "stellar-lense.fullname" . }}-cost-config
            {{- end }}
          env:
            {{- if .Values.postgresql.enabled }}
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "stellar-lense.fullname" . }}-postgresql
                  key: postgres-password
            - name: STELLARLENSE_DB_URL
              value: "postgresql://{{ .Values.postgresql.auth.username }}:$(PG_PASSWORD)@{{ include "stellar-lense.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
            {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /data
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "stellar-lense.fullname" . }}
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
