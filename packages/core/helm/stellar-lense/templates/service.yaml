apiVersion: v1
kind: Service
metadata:
  name: {{ include "stellar-lense.fullname" . }}
  labels:
    {{- include "stellar-lense.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "stellar-lense.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
