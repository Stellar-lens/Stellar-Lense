[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stellar-lense-core"
version = "0.2.0"
description = "Benford's Law + heuristic wash-trading detection engine for the Stellar DEX"
requires-python = ">=3.10"
authors = [
    { name = "Stellar Lense Contributors" },
]
license = { text = "MIT" }
readme = "README.md"

# Only what the detection engine imports. Everything that used to be listed
# here for the research surfaces (federated learning, ZK proofs, GNNs,
# causal inference, gRPC/GraphQL, EVM/Solana bridges, OpenTelemetry, ...)
# was archived with that code - see the archive-pre-consolidation tag.
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.2.0,<3.0",
    "python-dotenv>=1.0.0,<2.0",
    "pandas>=2.2.0,<3.0",
    "numpy>=1.26.0,<3.0",
    "scipy>=1.12.0,<2.0",
    "httpx>=0.27.0,<1.0",
    "packaging>=23.0,<25.0",
    "prometheus-client==0.20.0",
]

[project.urls]
Homepage = "https://github.com/Stellar-lens/Stellar-Lense"
Repository = "https://github.com/Stellar-lens/Stellar-Lense.git"

[project.optional-dependencies]
# Optional ML path: a scikit-learn model trained by a reproducible script,
# plus SHAP attributions for it. Scoring works without these installed.
ml = [
    "scikit-learn>=1.4.0,<2.0",
    "joblib>=1.3.0,<2.0",
    "shap>=0.45.0,<1.0",
]
# On-chain publishing to the stellar-lense-registry Soroban contract.
chain = [
    "stellar-sdk==16.1.1",
]
test = [
    "stellar-lense-core[ml,chain]",
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-timeout>=2.3.0,<3.0",
    "hypothesis>=6.100.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["config", "detection", "ingestion", "pipeline", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-m 'not slow and not benchmark'"
markers = [
    "benchmark: performance benchmarks (excluded by default; run with -m benchmark)",
    "slow: long-running tests (excluded by default; run with -m slow)",
]
filterwarnings = [
    "ignore::UserWarning:sklearn.utils.parallel",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E402: module-level import not at top (conditional numba import in detection/)
ignore = ["E402"]
