groups:
  - name: stellar_lense
    rules:
      - alert: SorobanCircuitBreakerOpen
        expr: increase(stellar_lense_circuit_breaker_open_total[5m]) > 0
        for: 0m
        annotations:
          summary: "Soroban circuit breaker opened"
          description: "The Soroban circuit breaker has opened due to consecutive submission failures. Check RPC connectivity and service key configuration."
          runbook: "Inspect logs for SorobanCircuitOpenError. Verify SOROBAN_RPC_URL, STELLARLENSE_SERVICE_SECRET_KEY, and contract authorization. Circuit auto-resets after SOROBAN_CIRCUIT_RESET_SECONDS (default 300s)."

      - alert: WebhookDeadLetterBacklog
        expr: increase(stellar_lense_webhook_deliveries_total{result="dead_lettered"}[1h]) > 10
        for: 0m
        annotations:
          summary: "Webhook dead-letter backlog exceeds threshold"
          description: "More than 10 webhook deliveries have permanently failed in the last hour."
          runbook: "Inspect GET /webhooks/dead-letters. Check subscriber URLs are reachable over HTTPS. Verify STELLARLENSE_WEBHOOK_ENCRYPTION_KEY is set. Dead letters require manual intervention or subscriber re-registration."

      - alert: FeatureDriftDetected
        expr: increase(stellar_lense_drift_detected_total[24h]) > 0
        for: 0m
        annotations:
          summary: "Feature distribution drift detected"
          description: "At least one feature-drift event was recorded in the last 24 hours."
          runbook: "Run `python cli.py retrain-check` to review the drift report. Check /admin/drift-reports for PSI values. If PSI > 0.25 on key Benford features, consider running `cli.py retrain-check --force-retrain`."

      - alert: ScoringLatencyHigh
        expr: histogram_quantile(0.95, rate(stellar_lense_scoring_latency_seconds_bucket[10m])) > 2.0
        for: 5m
        annotations:
          summary: "p95 scoring latency exceeds 2 seconds"
          description: "The 95th-percentile wallet scoring latency is above 2.0s over the last 10 minutes."
          runbook: "Check Horizon API latency (HORIZON_URL), model inference load, and DB write throughput. Consider reducing TRADE_HISTORY_LOOKBACK_DAYS or scaling the pipeline. Acts as a backstop symptom alert alongside SLO burn-rate alerts."

      - alert: PipelineStalled
        expr: (time() - stellar_lense_pipeline_run_duration_seconds_created) > 300
        for: 0m
        annotations:
          summary: "Pipeline has not run in over 5 minutes"
          description: "The detection pipeline last completed more than 300 seconds ago."
          runbook: "Check that `python run_pipeline.py` or `cli.py score` is running and not stuck. Review logs for exceptions in horizon ingestion or model loading. Verify STELLARLENSE_DB_PATH is writable."

      - alert: WAFAbuseDetected
        expr: increase(stellar_lense_waf_blocks_total[5m]) > 10
        for: 1m
        annotations:
          summary: "WAF detected potential abuse"
          description: "More than 10 requests have been blocked by the WAF in the last 5 minutes."
          runbook: "Review blocked requests via GET /admin/waf/blocked-requests. Check for SQLi/XSS patterns or oversized requests. Consider adjusting rate limits or blocking specific clients if needed."

      - alert: SecretRotationOverdue
        expr: stellar_lense_secret_rotation_overdue > 0
        for: 0m
        annotations:
          summary: "Secret rotation is overdue"
          description: "One or more active API keys have exceeded the maximum age without rotation."
          runbook: "Identify the overdue key using the API key metadata or database. Rotate the key immediately via the POST /admin/api-keys/{key_id}/rotate endpoint or namespace rotation."

      # -----------------------------------------------------------------
      # SLO burn-rate alerts (multi-window, multi-burn-rate — see docs/slo.md)
      #
      # Each SLO gets a fast-burn (14.4x, 1h+5m windows, page) and a
      # slow-burn (6.0x, 6h+30m windows, ticket) alert. Both windows must
      # exceed the burn-rate threshold simultaneously — this is what
      # distinguishes a real, sustained budget burn from a short blip that
      # a single-window threshold would either miss or false-positive on.
      # Uses the same good/total metric definitions as the ratio_rate5m /
      # error_budget_remaining recording rules in recording_rules.yml,
      # just evaluated directly over each alert's own window instead of
      # the fixed 5m the recording rules use.
      # -----------------------------------------------------------------

      # --- Score Availability (target 99.5%, error budget 0.5%) ---
      - alert: ScoreAvailabilitySLOFastBurn
        expr: |
          (
            (1 - (sum(rate(stellar_lense_api_request_duration_seconds_count{method="GET",endpoint=~"/v1/scores/\{wallet\}|/scores/\{wallet\}",status_code!~"5.."}[1h])) / sum(rate(stellar_lense_api_request_duration_seconds_count{method="GET",endpoint=~"/v1/scores/\{wallet\}|/scores/\{wallet\}"}[1h])))) > (14.4 * 0.005)
          and
            (1 - (sum(rate(stellar_lense_api_request_duration_seconds_count{method="GET",endpoint=~"/v1/scores/\{wallet\}|/scores/\{wallet\}",status_code!~"5.."}[5m])) / sum(rate(stellar_lense_api_request_duration_seconds_count{method="GET",endpoint=~"/v1/scores/\{wallet\}|/scores/\{wallet\}"}[5m])))) > (14.4 * 0.005)
          )
        for: 2m
        annotations:
          summary: "Score Availability SLO: fast error-budget burn"
          description: "GET /scores/{wallet} is on track to exhaust its 30-day error budget in ~2 days at the current 5xx rate."
          runbook: "Check GET /admin/slo-status for current budget. Investigate recent deploys, DB contention, and upstream Horizon errors. This is a page-worthy burn rate — page the on-call."

      - alert: ScoreAvailabilitySLOSlowBurn
        expr: |
          (
            (1 - (sum(rate(stellar_lense_api_request_duration_seconds_count{method="GET",endpoint=~"/v1/scores/\{wallet\}|/scores/\{wallet\}",status_code!~"5.."}[6h])) / sum(rate(stellar_lense_api_request_duration_seconds_count{method="GET",endpoint=~"/v1/scores/\{wallet\}|/scores/\{wallet\}"}[6h])))) > (6.0 * 0.005)
          and
            (1 - (sum(rate(stellar_lense_api_request_duration_seconds_count{method="GET",endpoint=~"/v1/scores/\{wallet\}|/scores/\{wallet\}",status_code!~"5.."}[30m])) / sum(rate(stellar_lense_api_request_duration_seconds_count{method="GET",endpoint=~"/v1/scores/\{wallet\}|/scores/\{wallet\}"}[30m])))) > (6.0 * 0.005)
          )
        for: 15m
        annotations:
          summary: "Score Availability SLO: slow error-budget burn"
          description: "GET /scores/{wallet} is on track to exhaust its 30-day error budget in ~5 days at the current 5xx rate."
          runbook: "Check GET /admin/slo-status for current budget. File a ticket for triage during business hours — not page-worthy yet."

      # --- Scoring Latency (target 99% under 2.0s, error budget 1%) ---
      - alert: ScoringLatencySLOFastBurn
        expr: |
          (
            (1 - (sum(rate(stellar_lense_scoring_latency_seconds_bucket{le="2.0"}[1h])) / sum(rate(stellar_lense_scoring_latency_seconds_count[1h])))) > (14.4 * 0.01)
          and
            (1 - (sum(rate(stellar_lense_scoring_latency_seconds_bucket{le="2.0"}[5m])) / sum(rate(stellar_lense_scoring_latency_seconds_count[5m])))) > (14.4 * 0.01)
          )
        for: 2m
        annotations:
          summary: "Scoring Latency SLO: fast error-budget burn"
          description: "Wallet scoring is on track to exhaust its 30-day <2.0s latency budget in ~2 days."
          runbook: "Check Horizon API latency, model inference load, and DB write throughput (see ScoringLatencyHigh's runbook). Page-worthy burn rate."

      - alert: ScoringLatencySLOSlowBurn
        expr: |
          (
            (1 - (sum(rate(stellar_lense_scoring_latency_seconds_bucket{le="2.0"}[6h])) / sum(rate(stellar_lense_scoring_latency_seconds_count[6h])))) > (6.0 * 0.01)
          and
            (1 - (sum(rate(stellar_lense_scoring_latency_seconds_bucket{le="2.0"}[30m])) / sum(rate(stellar_lense_scoring_latency_seconds_count[30m])))) > (6.0 * 0.01)
          )
        for: 15m
        annotations:
          summary: "Scoring Latency SLO: slow error-budget burn"
          description: "Wallet scoring is on track to exhaust its 30-day <2.0s latency budget in ~5 days."
          runbook: "Check GET /admin/slo-status for current budget. File a ticket for triage during business hours — not page-worthy yet."

      # --- Webhook Delivery (target 99%, error budget 1%) ---
      - alert: WebhookDeliverySLOFastBurn
        expr: |
          (
            (1 - (sum(rate(stellar_lense_webhook_deliveries_total{result="delivered"}[1h])) / sum(rate(stellar_lense_webhook_deliveries_total[1h])))) > (14.4 * 0.01)
          and
            (1 - (sum(rate(stellar_lense_webhook_deliveries_total{result="delivered"}[5m])) / sum(rate(stellar_lense_webhook_deliveries_total[5m])))) > (14.4 * 0.01)
          )
        for: 2m
        annotations:
          summary: "Webhook Delivery SLO: fast error-budget burn"
          description: "Webhook deliveries are on track to exhaust the 30-day success-rate budget in ~2 days."
          runbook: "Check GET /webhooks/dead-letters and subscriber URL reachability (see WebhookDeadLetterBacklog's runbook). Page-worthy burn rate."

      - alert: WebhookDeliverySLOSlowBurn
        expr: |
          (
            (1 - (sum(rate(stellar_lense_webhook_deliveries_total{result="delivered"}[6h])) / sum(rate(stellar_lense_webhook_deliveries_total[6h])))) > (6.0 * 0.01)
          and
            (1 - (sum(rate(stellar_lense_webhook_deliveries_total{result="delivered"}[30m])) / sum(rate(stellar_lense_webhook_deliveries_total[30m])))) > (6.0 * 0.01)
          )
        for: 15m
        annotations:
          summary: "Webhook Delivery SLO: slow error-budget burn"
          description: "Webhook deliveries are on track to exhaust the 30-day success-rate budget in ~5 days."
          runbook: "Check GET /admin/slo-status for current budget. File a ticket for triage during business hours — not page-worthy yet."

      # --- Soroban Submission (target 99% success, excluding dry runs, error budget 1%) ---
      - alert: SorobanSubmissionSLOFastBurn
        expr: |
          (
            (1 - (sum(rate(stellar_lense_soroban_submissions_total{status="success"}[1h])) / sum(rate(stellar_lense_soroban_submissions_total{status!="skipped"}[1h])))) > (14.4 * 0.01)
          and
            (1 - (sum(rate(stellar_lense_soroban_submissions_total{status="success"}[5m])) / sum(rate(stellar_lense_soroban_submissions_total{status!="skipped"}[5m])))) > (14.4 * 0.01)
          )
        for: 2m
        annotations:
          summary: "Soroban Submission SLO: fast error-budget burn"
          description: "On-chain score submissions are on track to exhaust the 30-day success-rate budget in ~2 days."
          runbook: "Check the Soroban circuit breaker state (see SorobanCircuitBreakerOpen's runbook), RPC connectivity, and service key authorization. Page-worthy burn rate."

      - alert: SorobanSubmissionSLOSlowBurn
        expr: |
          (
            (1 - (sum(rate(stellar_lense_soroban_submissions_total{status="success"}[6h])) / sum(rate(stellar_lense_soroban_submissions_total{status!="skipped"}[6h])))) > (6.0 * 0.01)
          and
            (1 - (sum(rate(stellar_lense_soroban_submissions_total{status="success"}[30m])) / sum(rate(stellar_lense_soroban_submissions_total{status!="skipped"}[30m])))) > (6.0 * 0.01)
          )
        for: 15m
        annotations:
          summary: "Soroban Submission SLO: slow error-budget burn"
          description: "On-chain score submissions are on track to exhaust the 30-day success-rate budget in ~5 days."
          runbook: "Check GET /admin/slo-status for current budget. File a ticket for triage during business hours — not page-worthy yet."
