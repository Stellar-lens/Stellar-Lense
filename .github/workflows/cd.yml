name: CD
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment configuration
        id: deploy-config
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping CD deployment: DOCKER_USERNAME and/or DOCKER_PASSWORD secrets are not configured."
          fi

      - name: Set up Docker Buildx
        if: steps.deploy-config.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        if: steps.deploy-config.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: steps.deploy-config.outputs.enabled == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/ledgerlens:${{ github.sha }}

      - name: Set up Kubeconfig
        if: steps.deploy-config.outputs.enabled == 'true'
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.27.0"

      - name: Deploy with Helm
        if: steps.deploy-config.outputs.enabled == 'true'
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install ledgerlens ./helm/ledgerlens \
            --set image.repository=${{ env.DOCKER_USERNAME }}/ledgerlens \
            --set image.tag=${{ github.sha }} \
            --set canary.enabled=true
