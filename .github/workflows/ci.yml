name: CI

# The single required check for branch protection on main: every PR runs
# the same `make lint-all` / `make test-all` a contributor would run
# locally, so "CI is green" and "it works on my machine" mean the same
# thing. See infra/ci/README.md and docs/stellar-lens-project-plan.md §2/§6.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint-all + test-all
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.13"
          enable-cache: true

      # contracts/soroban/rust-toolchain.toml pins the exact channel/targets/
      # components this repo needs (1.81.0 - see that file's comment for why:
      # newer rustc changes wasm32-unknown-unknown codegen incompatibly with
      # the Soroban host). dtolnay/rust-toolchain@master used to auto-detect
      # that file when no `toolchain:` input was given; as of some point
      # after this workflow was written, the action made `toolchain` a
      # strictly required input with no such fallback (see its action.yml —
      # it now errors "'toolchain' is a required input" immediately if
      # empty), which silently broke every job before it ever reached
      # `make test-all`. Read the channel out of the toml file at runtime
      # instead of hardcoding it here too, so rust-toolchain.toml stays the
      # single source of truth rather than drifting out of sync with a
      # second copy of the version pin.
      - name: Read Rust toolchain channel from rust-toolchain.toml
        id: rust_toolchain
        run: |
          channel=$(grep -m1 '^channel' contracts/soroban/rust-toolchain.toml | sed -E 's/channel *= *"([^"]+)"/\1/')
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/soroban

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: make lint-all
        run: make lint-all

      - name: make test-all
        run: make test-all
